name: Windows

# Manual only: Windows runners bill twice the minutes, and `pnpm validate` on the developer's Windows machine covers this before delivery (docs/CI.md).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Process-heavy API suites run several times slower on Windows, so they are split into parallel parts (scripts/test-part.mjs).
  windows:
    name: windows (part ${{ matrix.part }})
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    steps:
      # Real-time scanning of node_modules and spawned agent processes is the main slowdown on Windows runners.
      - shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/test-part.mjs ${{ matrix.part }}
