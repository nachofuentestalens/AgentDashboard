name: CI

# Only pull requests: a squash merge lands the tree its pull request already checked, so re-running on main doubled the minutes.
on:
  pull_request:
  workflow_dispatch:

# A new push to a pull request supersedes its running checks.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One Linux job: every extra job pays setup again and rounds up to a whole billed minute (docs/CI.md).
  checks:
    runs-on: ubuntu-latest
    # The time budget (docs/CI.md). Raising it needs a justification in the pull request.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      # Runner images ship Google Chrome, so skip downloading Playwright's Chromium and its system packages.
      - run: pnpm test:e2e
        env:
          PW_CHROMIUM: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e
          path: test-results/
          if-no-files-found: ignore
